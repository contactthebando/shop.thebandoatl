const about=()=>`<section class="collection-hero"><span class="eyebrow">THE BANDO ATL / THE NEXT CHAPTER</span><h1>FROM WINGS<br>TO FITS.</h1><p>We built a place rooted in Atlanta. Now we're taking that same energy into the streets, one piece at a time.</p></section><section class="story"><div class="brand-lockup"><img class="word" src="${A}bando-logo.png" alt="The Bando logo: boarded-up house under The Bando lettering" style="transform:none;width:min(480px,90%)"></div><div class="story-copy"><span class="eyebrow">NEW CHAPTER. SAME BANDO.</span><h2>WE DIDN'T<br>RUSH THIS.</h2><p>The Bando started with food, community and a love for the culture that makes Atlanta what it is. Every day, the people walking through our doors brought their own style. We saw the fits, the confidence and the way our city makes everyday clothes personal.</p><p>So we took that energy somewhere new: apparel. We worked with designers, tested vendors, went back and forth on the details, dealt with delays, and kept pushing until the pieces felt right. The Racing 21 collection is our first statement. Our Bando Classics keep the everyday rotation covered.</p><p>This isn't us walking away from the restaurant. It's the same house, opening another door. Straight out the Bando, into the city.</p><a class="secondary" href="#shop">SHOP THE FIRST DROP</a></div></section>`;
function render(){let h=decodeURIComponent(location.hash.slice(1));let html;if(!h||h==='home')html=home();else if(h==='shop')html=`<div class="collection-hero shop-all-hero"><div class="eyebrow">THE ENTIRE ROTATION</div><h1>SHOP ALL.</h1><p>Statement layers, separates, and the classics that stay in rotation.</p><img class="collection-mascot" src="${A}character.png" alt="Bando character artwork"></div><section class="section">${grid(products)}</section>`;else if(h==='racing'||h==='signatures')html=collection(h);else if(h.startsWith('p-')){let p=products.find(x=>x.id===h.slice(2));html=p?productPage(p):home()}else if(h==='about')html=about();else html=home();app.innerHTML=html;window.scrollTo(0,0);document.querySelector('#nav').classList.remove('open');wireProduct();initCinemaMotion()}
function wireProduct(){document.querySelectorAll('[data-image]').forEach(b=>b.addEventListener('click',()=>{let idx=Number(b.dataset.image),p=products.find(x=>location.hash.endsWith(x.id));if(!p)return;document.querySelector('#bigImage').src=A+p.img[idx];document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('active',x===b))}));}
document.querySelector('#menu').onclick=()=>document.querySelector('#nav').classList.toggle('open');window.addEventListener('hashchange',render);render();

// V8: interactive motion control, respects OS reduced-motion preference.
function initCinemaMotion(){
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('.cinema').forEach(section=>{
  const img=section.querySelector('.cinema-rotation');const btn=section.querySelector('[data-motion-toggle]');
  let active=!reduced;
  const update=()=>{img.src=active?'assets/racing-rotation-preview.gif':'assets/racing-rotation-poster.jpg';btn.textContent=active?'PAUSE MOTION':'PLAY MOTION';btn.setAttribute('aria-pressed',String(!active));};
  btn.addEventListener('click',()=>{active=!active;update()});update();
 });
}
